server {
    listen 127.0.0.1:9870;
    location / {
        # только чтение: POST/PUT в REST API YARN позволяют запускать произвольный код
        limit_except GET HEAD { deny all; }
        proxy_pass http://team-32-nn:9870;
        proxy_set_header Host $http_host; # с портом, иначе редиректы уводят на порт 80
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'team-32-nn:9870' '$host:9870';
        sub_filter '10.32.0.11:9870' '$host:9870';
        sub_filter 'team-32-nn:8088' '$host:8088';
